services:
  playwright-tests:
    # We use the exact playwright version matching package.json to prevent binary mismatch
    image: mcr.microsoft.com/playwright:v1.59.1-jammy
    init: true
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    # config/env.config.ts loads config/.env from the mounted project directory.
    # Use `docker compose run -e NAME=value` to override a value for one run.
    command: /bin/bash -lc "npm ci && npm test"
