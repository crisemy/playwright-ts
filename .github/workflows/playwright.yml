name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Type-check
      run: npm run type-check
      
    - name: Run Playwright tests
      run: npm test
      env:
        # These pull from GitHub Repository Secrets (Settings > Secrets and variables > Actions)
        BASE_URL: ${{ secrets.BASE_URL || 'https://the-internet.herokuapp.com' }}
        ADMIN_USER: ${{ secrets.ADMIN_USER || 'tomsmith' }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'SuperSecretPassword!' }}
        LOG_LEVEL: info

    - name: Upload Playwright HTML report
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Playwright test artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-test-results
        path: test-results/
        if-no-files-found: ignore
        retention-days: 30
